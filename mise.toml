[tools]
age = "1.3"
opentofu = "1.12"
prek = { version = "0.4", postinstall = "prek install" }
rust = "latest"
sops = "3.13"
yq = "latest"

[tasks.setup]
run = """
grep 'filter "sops"' .git/config && exit 0 || true
config='[filter "sops"]
    clean = ./scripts/encrypt.sh %f
    smudge = ./scripts/decrypt.sh %f
    required = true
[diff "sops"]
    textconv = ./scripts/diffcrypt.sh
'
echo "$config" >> .git/config
"""

[hooks]
postinstall = { task = "setup" }
