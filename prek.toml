# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "local"
hooks = [
    {
        id = "ensure-sops",
        name = "Ensure all sops files are encrypted",
        language = "script",
        entry = "./scripts/ensure_sops.sh",
        groups = ["sops"]
    },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files" },
  { id = "check-shebang-scripts-are-executable" },
]

[[repos]]
repo = "https://github.com/tofuutils/pre-commit-opentofu"
rev = "v2.2.2"
hooks = [
  { id = "tofu_fmt" },
  {
    id = "tofu_validate",
    args = ["--hook-config=--retry-once-with-cleanup=true"]
  },
  {
    id = "tofu_providers_lock",
    args = ["--hook-config=--mode=only-check-is-current-lockfile-cross-platform"]
  }
]
